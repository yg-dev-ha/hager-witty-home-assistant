name: New Hager status code
description: Report a real-world StatusEvent.Type capture
title: "[Status code]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Use this form for event codes not yet classified. **Never include OAuth tokens or authorization codes.**
  - type: input
    id: event_code
    attributes:
      label: StatusEvent.Type
      placeholder: "2008"
    validations:
      required: true
  - type: input
    id: description
    attributes:
      label: ShortDescription / LongDescription
      placeholder: "Exact text returned by Hager"
    validations:
      required: true
  - type: dropdown
    id: plugged
    attributes:
      label: Was the vehicle plugged in?
      options: ["Yes", "No", "Unknown"]
    validations:
      required: true
  - type: dropdown
    id: charging
    attributes:
      label: Was the vehicle actually charging?
      options: ["Yes", "No", "Unknown"]
    validations:
      required: true
  - type: dropdown
    id: action
    attributes:
      label: What happened immediately before the capture?
      options: ["Nothing / steady state", "Start requested", "Stop requested", "Cable connected", "Cable disconnected", "Other"]
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add timestamps or sanitized log lines if useful.
