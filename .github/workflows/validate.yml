name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the manifest version after validation
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tests:
    name: Offline regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install aiohttp
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q custom_components
      - run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: manual-install-package
          path: dist/*.zip

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  release:
    name: Publish validated release
    needs: [tests, hacs, hassfest]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.publish_release))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: manual-install-package
          path: dist
      - name: Publish immutable version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          version=$(python -c 'import json; print(json.load(open("custom_components/hager_witty/manifest.json"))["version"])')
          if [[ "$EVENT_NAME" == "push" && "$version" != "0.1.0" ]]; then
            echo "Later releases require an explicit workflow dispatch."
            exit 0
          fi
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release v$version already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "v$version" "dist/hager-witty-v$version.zip" \
            --target "$COMMIT_SHA" --title "v$version — Hager Witty Start" \
            --notes-file "docs/releases/v$version.md"
